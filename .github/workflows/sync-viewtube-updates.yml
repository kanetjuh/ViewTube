name: Sync ViewTube Update Manifests

on:
  release:
    types:
      - published
      - edited

  push:
    branches:
      - main
    paths:
      - 'smarttubetv/build.gradle'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate ViewTube update manifests
        run: |
          python3 scripts/sync_viewtube_updates.py

      - name: Commit manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            update/viewtube_stable.json \
            update/viewtube_beta.json

          if git diff --cached --quiet; then
            echo "Update manifests zijn al actueel."
            exit 0
          fi

          git commit -m "chore: sync ViewTube update manifests"
          git push origin main
